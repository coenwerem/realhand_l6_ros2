name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  jazzy:
    runs-on: ubuntu-24.04
    container:
      image: ros:jazzy
    steps:
      - name: container prerequisites
        run: |
          apt-get update
          apt-get install -y sudo git python3-vcstool python3-colcon-common-extensions \
            python3-rosdep ros-jazzy-rmw-fastrtps-cpp
      - name: virtual CAN for the driver test
        run: |
          (modprobe vcan && ip link add dev vcan0 type vcan && ip link set up vcan0) \
            || echo "vcan unavailable in the container, the vcan test will skip"
      - uses: ros-tooling/action-ros-ci@v0.4
        with:
          target-ros2-distro: jazzy
          import-token: ${{ secrets.GITHUB_TOKEN }}
          package-name: |
            realhand_hardware
            realhand_contact_controller
            realhand_l6_description
            realhand_l6_bringup
            realhand_l6_moveit_config
          skip-tests: true
      - name: test with the workspace sourced
        shell: bash
        run: |
          cd ros_ws
          source /opt/ros/jazzy/setup.bash
          source install/setup.bash
          colcon test --event-handlers console_direct+ \
            --packages-select realhand_hardware realhand_contact_controller realhand_l6_description realhand_l6_bringup realhand_l6_moveit_config
          colcon test-result --verbose
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: colcon-logs
          path: ros_ws/log
